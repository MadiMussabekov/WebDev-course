openapi: 3.0.3
info:
  title: HoloNet Galactic Atlas API
  version: 1.0.0
  description: A Star Wars atlas built on data imported from SWAPI. Browse planets,
    species, people, films and starships, compute hyperspace distances between worlds
    and estimate travel times for any starship.
paths:
  /api/stats/:
    get:
      operationId: stats_retrieve
      summary: Galaxy-wide statistics
      tags:
      - Service
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      summary: Health check (API + database)
      tags:
      - Service
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/planets/:
    get:
      operationId: planets_list
      description: Lets /resource/{id}/ accept an id, slug or name.
      summary: List planets
      parameters:
      - in: query
        name: charted
        schema:
          type: boolean
      - in: query
        name: climate
        schema:
          type: string
      - in: query
        name: max_population
        schema:
          type: integer
      - in: query
        name: min_population
        schema:
          type: integer
      - in: query
        name: name
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: region
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: terrain
        schema:
          type: string
      tags:
      - Planets
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPlanetList'
          description: ''
    post:
      operationId: planets_create
      description: Lets /resource/{id}/ accept an id, slug or name.
      summary: Create a planet
      tags:
      - Planets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlanetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlanetRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Planet'
          description: ''
  /api/planets/distance/:
    get:
      operationId: planets_distance_retrieve
      description: Computes the straight-line hyperspace distance between two charted
        planets using their galactic grid coordinates. Pass `starship` to also estimate
        the travel time based on its hyperdrive rating.
      summary: Distance between two planets
      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: Origin planet id, slug or name.
        required: true
      - in: query
        name: starship
        schema:
          type: string
        description: Optional starship id, slug or name.
      - in: query
        name: to
        schema:
          type: string
        description: Destination planet id, slug or name.
        required: true
      tags:
      - Navigation
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Distance'
          description: ''
        '400':
          description: Missing query parameters.
        '404':
          description: Planet or starship not found.
        '422':
          description: Route cannot be plotted (uncharted planet, no hyperdrive...).
  /api/planets/{id}/:
    get:
      operationId: planets_retrieve
      description: Lets /resource/{id}/ accept an id, slug or name.
      summary: Get a planet by id, slug or name
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: Numeric id, slug (`yavin-iv`) or exact name (`Yavin IV`, case-insensitive).
        required: true
      tags:
      - Planets
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Planet'
          description: ''
    patch:
      operationId: planets_partial_update
      description: Lets /resource/{id}/ accept an id, slug or name.
      summary: Partially update a planet
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: Numeric id, slug (`yavin-iv`) or exact name (`Yavin IV`, case-insensitive).
        required: true
      tags:
      - Planets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPlanetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPlanetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPlanetRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Planet'
          description: ''
    put:
      operationId: planets_update
      description: Lets /resource/{id}/ accept an id, slug or name.
      summary: Replace a planet
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: Numeric id, slug (`yavin-iv`) or exact name (`Yavin IV`, case-insensitive).
        required: true
      tags:
      - Planets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlanetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlanetRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Planet'
          description: ''
    delete:
      operationId: planets_destroy
      description: Lets /resource/{id}/ accept an id, slug or name.
      summary: Delete a planet
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: Numeric id, slug (`yavin-iv`) or exact name (`Yavin IV`, case-insensitive).
        required: true
      tags:
      - Planets
      security:
      - {}
      responses:
        '204':
          description: No response body
